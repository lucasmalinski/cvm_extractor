<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CVM Report</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/dataTables.bootstrap4.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/buttons/2.3.6/css/buttons.bootstrap4.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    
    <style>
        body { background-color: #f8f9fc; font-family: 'Inter', sans-serif; }
        .dashboard-container { 
            background: white; 
            border-radius: 15px; 
            box-shadow: 0 0.15rem 1.75rem 0 rgba(58, 59, 69, 0.15);
            padding: 2rem;
            margin-top: 2rem;
        }
        /* Fix the tall headers from your screenshot */
        table.dataTable thead th {
            vertical-align: middle !important;
            border-bottom: 2px solid #e3e6f0;
            background: #f8f9fc;
            color: #4e73df;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.05em;
        }
        .dt-buttons .btn {
            border-radius: 50px !important;
            padding: 0.5rem 1.5rem;
            font-size: 0.8rem;
            font-weight: 600;
            margin-right: 5px;
        }
    </style>
</head>
<body class="p-4">
    <div class="container-fluid dashboard-container">
        <div class="row align-items-center mb-4">
            <div class="col">
                <h3 class="font-weight-bold text-dark mb-0">Analysis Dashboard</h3>
                <span class="text-muted small">Asset Block {{ block }} | Period {{ month }}/{{ year }}</span>
            </div>
            <div class="col text-right">
                <a href="/" class="btn btn-sm btn-light border rounded-pill px-3">
                    <i class="fas fa-undo mr-1"></i> New Query
                </a>
            </div>
        </div>

        <div class="table-responsive">
            {{ table | safe }}
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.4/js/dataTables.bootstrap4.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.3.6/js/dataTables.buttons.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.3.6/js/buttons.bootstrap4.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.1.3/jszip.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.3.6/js/buttons.html5.min.js"></script>

    <script>
        $(document).ready(function() {
            $('#cvmTable').DataTable({
                "scrollX": true,
                "pageLength": 10,
                "dom": '<"d-flex justify-content-between align-items-center mb-4"Bf>rtip',
                "buttons": [
                    {
                        extend: 'csvHtml5',
                        text: '<i class="fas fa-file-csv mr-1"></i> Export CSV',
                        className: 'btn btn-success shadow-sm'
                    },
                    {
                        extend: 'excelHtml5',
                        text: '<i class="fas fa-file-excel mr-1"></i> Export Excel',
                        className: 'btn btn-info shadow-sm'
                    }
                ]
            });
        });
    </script>
</body>
</html>
